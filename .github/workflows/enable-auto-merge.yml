name: Auto-merge PRs by Default

on:
  pull_request:
    # synchronize covers PRs opened with merge conflicts, which trigger no workflows until a push.
    types: [opened, reopened, ready_for_review, synchronize]

# Only the latest push decides whether auto-merge stays on.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge
    # Turned off for PRs that touch a path in .github/CODEOWNERS; see REVIEW.md.
    uses: zenzontle/workflows/.github/workflows/auto-merge.yml@d20960c4116a2bea0412b2d717ed3034a4ed5c99 # main
    permissions:
      contents: write
      pull-requests: write
