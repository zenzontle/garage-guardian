name: Require Codex approval

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# If a new commit is pushed while an older run is still waiting,
# cancel the old run and start fresh for the new PR HEAD.
concurrency:
  group: codex-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  codex-approval:
    name: Codex approval
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for Codex approval
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const codexLogin = 'chatgpt-codex-connector[bot]';

            // Capture the PR HEAD this workflow run is responsible for.
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            const headSha = pr.head.sha;

            core.info(`Waiting for Codex review of ${headSha}`);

            // Every 20 seconds for up to 10 minutes.
            const attempts = 30;
            const delayMs = 20_000;

            for (let attempt = 1; attempt <= attempts; attempt++) {
              // Make sure this run is still for the current PR HEAD.
              const { data: currentPr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number
              });

              if (currentPr.head.sha !== headSha) {
                core.info(
                  `PR HEAD changed from ${headSha} to ${currentPr.head.sha}. ` +
                  `A new workflow run will handle it.`
                );
                return;
              }

              // Check for Codex's 👍 approval.
              const reactions = await github.paginate(
                github.rest.reactions.listForIssue,
                {
                  owner,
                  repo,
                  issue_number: pull_number,
                  content: '+1',
                  per_page: 100
                }
              );

              core.info(
                `Thumbs-up reactions: ` +
                reactions.map(
                  r => `${r.user?.login} @ ${r.created_at}`
                ).join(', ')
              );

              const approval = reactions.find(
                reaction => reaction.user?.login === codexLogin
              );

              if (approval) {
                core.info(
                  `Codex approved with 👍 at ${approval.created_at}.`
                );
                return;
              }

              // No 👍 yet. Look for Codex review feedback.
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100
                }
              );

              const codexReviewWithFeedback = reviews.find(review =>
                review.user?.login === codexLogin &&
                review.commit_id === headSha &&
                (
                  review.state === 'COMMENTED' ||
                  review.state === 'CHANGES_REQUESTED'
                )
              );

              if (codexReviewWithFeedback) {
                core.setFailed(
                  `Codex left review feedback for ${headSha}. ` +
                  `Address the feedback and push a new commit.`
                );
                return;
              }

              // Check inline comments.
              const reviewComments = await github.paginate(
                github.rest.pulls.listReviewComments,
                {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100
                }
              );

              const codexInlineFeedback = reviewComments.find(comment =>
                comment.user?.login === codexLogin &&
                comment.original_commit_id === headSha
              );

              if (codexInlineFeedback) {
                core.setFailed(
                  `Codex left inline feedback for ${headSha} ` +
                  `in ${codexInlineFeedback.path}. ` +
                  `Address the feedback and push a new commit.`
                );
                return;
              }

              core.info(
                `Attempt ${attempt}/${attempts}: ` +
                `no Codex 👍 or feedback yet.`
              );

              if (attempt < attempts) {
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

            core.setFailed(
              `Codex did not approve ${headSha} within 10 minutes.`
            );
