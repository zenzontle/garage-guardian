name: Require Codex approval

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# If a new commit is pushed while an older run is still waiting,
# cancel the old run and start fresh for the new PR HEAD.
concurrency:
  group: codex-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  codex-approval:
    name: Codex approval
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for Codex approval
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const codexLogin = 'chatgpt-codex-connector[bot]';

            // Tie this workflow run to the exact PR revision that triggered it.
            const headSha = context.payload.pull_request.head.sha;

            // Only accept a Codex 👍 created after the PR revision
            // that triggered this workflow run.
            const revisionStartedAt = new Date(
              context.payload.pull_request.updated_at
            ).getTime();

            core.info(
              `Waiting for Codex review of ${headSha}. ` +
              `Approval must be at or after ` +
              `${new Date(revisionStartedAt).toISOString()}.`
            );

            // Every 20 seconds for up to 10 minutes.
            const attempts = 30;
            const delayMs = 20_000;

            for (let attempt = 1; attempt <= attempts; attempt++) {
              // Make sure this run is still responsible for the current PR HEAD.
              const { data: currentPr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number
              });

              if (currentPr.head.sha !== headSha) {
                core.info(
                  `PR HEAD changed from ${headSha} to ${currentPr.head.sha}. ` +
                  `A new workflow run will handle it.`
                );
                return;
              }

              // Check for Codex's 👍 approval created for this PR revision.
              const reactions = await github.paginate(
                github.rest.reactions.listForIssue,
                {
                  owner,
                  repo,
                  issue_number: pull_number,
                  content: '+1',
                  per_page: 100
                }
              );

              const codexReactions = reactions.filter(
                reaction => reaction.user?.login === codexLogin
              );

              core.info(
                `Codex thumbs-up reactions: ` +
                (
                  codexReactions.length
                    ? codexReactions.map(reaction => {
                        const createdAt = new Date(
                          reaction.created_at
                        ).getTime();

                        return (
                          `${reaction.created_at} ` +
                          `(${createdAt >= revisionStartedAt
                            ? 'current'
                            : 'stale'})`
                        );
                      }).join(', ')
                    : 'none'
                )
              );

              // Safe to only search for new reactions since Codex will
              // automatically clear stale reactions after a change is pushed
              const approval = codexReactions.find(reaction =>
                new Date(reaction.created_at).getTime() >= revisionStartedAt
              );

              if (approval) {
                core.info(
                  `Codex approved ${headSha} with 👍 at ` +
                  `${approval.created_at}.`
                );
                return;
              }

              // Look for Codex review feedback tied directly to this HEAD.
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100
                }
              );

              const codexReviewWithFeedback = reviews.find(review =>
                review.user?.login === codexLogin &&
                review.commit_id === headSha &&
                (
                  review.state === 'COMMENTED' ||
                  review.state === 'CHANGES_REQUESTED'
                )
              );

              if (codexReviewWithFeedback) {
                core.setFailed(
                  `Codex left review feedback for ${headSha}. ` +
                  `Address the feedback and push a new commit.`
                );
                return;
              }

              // Check inline comments tied directly to this HEAD.
              const reviewComments = await github.paginate(
                github.rest.pulls.listReviewComments,
                {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100
                }
              );

              const codexInlineFeedback = reviewComments.find(comment =>
                comment.user?.login === codexLogin &&
                comment.original_commit_id === headSha
              );

              if (codexInlineFeedback) {
                core.setFailed(
                  `Codex left inline feedback for ${headSha} ` +
                  `in ${codexInlineFeedback.path}. ` +
                  `Address the feedback and push a new commit.`
                );
                return;
              }

              core.info(
                `Attempt ${attempt}/${attempts}: ` +
                `no Codex approval or feedback for ${headSha} yet.`
              );

              if (attempt < attempts) {
                await new Promise(resolve =>
                  setTimeout(resolve, delayMs)
                );
              }
            }

            core.setFailed(
              `Codex did not approve ${headSha} within 10 minutes.`
            );
