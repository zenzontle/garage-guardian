name: Require Codex approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push starts a fresh wait for the new PR head.
concurrency:
  group: codex-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex:
    name: Codex
    uses: zenzontle/workflows/.github/workflows/codex-approval.yml@d20960c4116a2bea0412b2d717ed3034a4ed5c99 # main
    permissions:
      contents: read
      pull-requests: read
      issues: read
